name: Build

on:
  push:
  workflow_dispatch:

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Create Gradle wrapper
        run: gradle wrapper --gradle-version 8.10.2

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MusicApp-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk

  desktop:
    name: Windows app (unpacked)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Create Gradle wrapper
        run: gradle wrapper --gradle-version 8.10.2

      - name: Build Windows app
        run: .\gradlew.bat :desktopApp:createDistributable --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MusicApp-windows
          path: desktopApp/build/compose/binaries/main/app/
